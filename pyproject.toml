[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "learnbook"
version = "0.1.0"
description = "A foundation for a personal PDF learning app."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "pymupdf>=1.24",
    "streamlit>=1.65",
    "fastapi>=0.115",
    "httpx>=0.27",
    "python-multipart>=0.0.18",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "playwright>=1.50",
]

[tool.hatch.build.targets.wheel]
packages = ["src/learnbook"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -m 'not e2e'"
markers = ["e2e: browser end-to-end tests requiring an installed Playwright browser"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "double"